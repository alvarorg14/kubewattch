# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: kubewattch

# Operator and collector share the product release version.
builds:
  - id: operator
    main: ./cmd
    binary: manager
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]

  - id: collector
    main: ./cmd/collector
    binary: collector
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]

  - id: reporter
    main: ./cmd/reporter
    binary: reporter
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: reporter
    ids: [reporter]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_reporter_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE]
  - id: collector
    ids: [collector]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_collector_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE]
  - id: operator
    ids: [operator]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

# Release Please owns the changelog and creates the GitHub Release.
changelog:
  disable: true
release:
  mode: keep-existing
  replace_existing_artifacts: true

dockers_v2:
  - id: operator
    ids: [operator]
    dockerfile: build/operator/Dockerfile.goreleaser
    images:
      - "{{ .Env.OPERATOR_IMAGE }}"
    tags:
      - "{{ .Tag }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/alvarorg14/kubewattch
      org.opencontainers.image.version: "{{ .Tag }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    # Snapshots load single-platform images, which cannot carry index annotations.
    annotations:
      "index,manifest:org.opencontainers.image.source": '{{ if not .IsSnapshot }}https://github.com/alvarorg14/kubewattch{{ end }}'
      "index,manifest:org.opencontainers.image.version": '{{ if not .IsSnapshot }}{{ .Tag }}{{ end }}'
      "index,manifest:org.opencontainers.image.revision": '{{ if not .IsSnapshot }}{{ .FullCommit }}{{ end }}'

  - id: collector
    ids: [collector]
    dockerfile: build/collector/Dockerfile.goreleaser
    images: ["{{ .Env.COLLECTOR_IMAGE }}"]
    tags: ["{{ .Tag }}"]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/alvarorg14/kubewattch
      org.opencontainers.image.version: "{{ .Tag }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    annotations:
      "index,manifest:org.opencontainers.image.source": '{{ if not .IsSnapshot }}https://github.com/alvarorg14/kubewattch{{ end }}'
      "index,manifest:org.opencontainers.image.version": '{{ if not .IsSnapshot }}{{ .Tag }}{{ end }}'
      "index,manifest:org.opencontainers.image.revision": '{{ if not .IsSnapshot }}{{ .FullCommit }}{{ end }}'

  - id: reporter
    ids: [reporter]
    dockerfile: build/reporter/Dockerfile.goreleaser
    images: ["{{ .Env.REPORTER_IMAGE }}"]
    tags: ["{{ .Tag }}"]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/alvarorg14/kubewattch
      org.opencontainers.image.version: "{{ .Tag }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    annotations:
      "index,manifest:org.opencontainers.image.source": '{{ if not .IsSnapshot }}https://github.com/alvarorg14/kubewattch{{ end }}'
      "index,manifest:org.opencontainers.image.version": '{{ if not .IsSnapshot }}{{ .Tag }}{{ end }}'
      "index,manifest:org.opencontainers.image.revision": '{{ if not .IsSnapshot }}{{ .FullCommit }}{{ end }}'
