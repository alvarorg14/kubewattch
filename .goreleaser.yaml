# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: kubewattch

# Only the manager exists today; add collector and reporter builds when implemented.
builds:
  - id: operator
    main: ./cmd
    binary: manager
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: operator
    ids: [operator]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

# Release Please owns the changelog and creates the GitHub Release.
changelog:
  disable: true
release:
  mode: keep-existing
  replace_existing_artifacts: true

dockers_v2:
  - id: operator
    ids: [operator]
    dockerfile: build/operator/Dockerfile.goreleaser
    images:
      - "{{ .Env.OPERATOR_IMAGE }}"
    tags:
      - "{{ .Tag }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/alvarorg14/kubewattch
      org.opencontainers.image.version: "{{ .Tag }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    annotations:
      "index,manifest:org.opencontainers.image.source": https://github.com/alvarorg14/kubewattch
      "index,manifest:org.opencontainers.image.version": "{{ .Tag }}"
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
