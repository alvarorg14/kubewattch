    id: problem
    attributes:
      label: Problem or use case
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome you want and any alternatives you considered.
