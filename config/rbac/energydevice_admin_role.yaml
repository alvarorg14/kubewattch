# This rule is not used by the project kubewattch itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over energy.kubewattch.alvarorg14.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubewattch
    app.kubernetes.io/managed-by: kustomize
  name: energydevice-admin-role
rules:
- apiGroups:
  - energy.kubewattch.alvarorg14.github.io
  resources:
  - energydevices
  verbs:
  - '*'
- apiGroups:
  - energy.kubewattch.alvarorg14.github.io
  resources:
  - energydevices/status
  verbs:
  - get
