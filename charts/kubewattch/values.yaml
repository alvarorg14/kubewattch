image:
  repository: ghcr.io/alvarorg14/kubewattch/operator
  tag: ""
  pullPolicy: IfNotPresent
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
leaderElection:
  enabled: true
metrics:
  servingCertSecret: ""
  serviceMonitor:
    enabled: false
    labels: {}
    caSecretName: ""
    caSecretKey: ca.crt
    prometheusServiceAccount:
      name: ""
      namespace: ""

collector:
  image:
    repository: ghcr.io/alvarorg14/kubewattch/collector
    tag: ""
  serviceMonitor:
    enabled: false
    labels: {}
    prometheusServiceAccount:
      name: ""
      namespace: ""

reporter:
  image:
    repository: ghcr.io/alvarorg14/kubewattch/reporter
    tag: ""
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
